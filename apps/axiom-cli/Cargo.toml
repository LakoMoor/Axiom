[package]
name = "axiom-cli"
description = "Axiom on the command line: every tool, the MCP server, setup and doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axiom-engine = { workspace = true }
axiom-engines = { workspace = true }
axiom-evidence = { workspace = true }
axiom-platform = { workspace = true }
axiom-mcp = { workspace = true }
axiom-ai = { workspace = true }
axiom-setup = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }

[features]
wasm-plugins = ["axiom-engine/wasm-plugins"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# The DPI-aware manifest for axiom-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
