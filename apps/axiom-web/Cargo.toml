[package]
name = "axiom-web"
description = "Axiom in the browser: drop a file to see what it is (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "axiom-web"
path = "src/main.rs"

# The whole app (the same `CraftApp` as the desktop window) in the browser.
[[bin]]
name = "axiom-app"
path = "src/app_main.rs"

[dependencies]
# Only the wasm-safe crates (`cargo xtask wasm`): no engine, platform, AI or desktop UI.
axiom-evidence = { workspace = true }
axiom-formats = { workspace = true }
axiom-analysis = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
axiom-engine = { workspace = true }
axiom-ai = { workspace = true }
axiom-setup = { workspace = true }
axiom-ui-egui = { workspace = true }
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
# Open button: the browser's file picker (an <input type="file">, read in memory).
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location"] }
