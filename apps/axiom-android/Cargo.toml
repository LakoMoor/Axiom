[package]
name = "axiom-android"
description = "Axiom on Android: the same app as the desktop window, in a native activity (an APK)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Android loads the app as a shared library and calls `android_main` in it.
[lib]
name = "axiom_android"
crate-type = ["cdylib"]

# Everything is for Android only, so a plain `cargo build --workspace` on a computer stays quick.
[target.'cfg(target_os = "android")'.dependencies]
axiom-android-glue = { workspace = true }
axiom-engine = { workspace = true }
axiom-ai = { workspace = true }
axiom-setup = { workspace = true }
axiom-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity", "persistence"] }
log = { workspace = true }
android_logger = "0.15"

# What `cargo apk build -p axiom-android` packs (see packaging/android/README.md).
[package.metadata.android]
package = "ai.storyteller.axiom"
apk_name = "Axiom"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Axiom"
# `INTERNET` is for the models hub and AI services; nothing else is asked for.

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|density|keyboard|uiMode"
launch_mode = "singleTop"
