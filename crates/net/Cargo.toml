[package]
name = "axiom-net"
description = "HTTP for Axiom: ureq on computers, synchronous XMLHttpRequest in a browser page"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# HTTPS (rustls) on computers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"

# In the browser there is no socket to open and `ring` doesn't build for it; a request is a
# synchronous XMLHttpRequest, which the page allows on its main thread.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["XmlHttpRequest"] }
wasm-bindgen = "0.2"
