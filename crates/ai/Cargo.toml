[package]
name = "axiom-ai"
description = "AI backends, the agent loop and crews for Axiom"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
axiom-evidence = { workspace = true }
axiom-engine = { workspace = true }
axiom-engines = { workspace = true }
axiom-formats = { workspace = true }
axiom-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
toml = { workspace = true }
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
axiom-testkit = { workspace = true }

# HTTPS (rustls) on computers. In the browser there is no socket to open and `ring` doesn't build for
# it, so the client is kept without TLS there until requests go through `fetch`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ureq = { version = "3", default-features = false }
